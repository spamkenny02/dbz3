name: Publish prebuilt IPS patch

on:
  push:
    branches: [main]
    paths:
      - "patches/Ultime-Menace-Native-Histoire.ips.gz"
      - ".github/workflows/publish-ips.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc patches/Ultime-Menace-Native-Histoire.ips.gz > patches/Ultime-Menace-Native-Histoire.ips
          echo "479c9f3996955df040d21fb7beda706f73f1dcd614b10c696a93fcadd970773a  patches/Ultime-Menace-Native-Histoire.ips" | sha256sum -c -

      - name: Commit IPS file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/Ultime-Menace-Native-Histoire.ips
          git commit -m "Add prebuilt Ultime Menace IPS patch"
          git push origin HEAD:main
